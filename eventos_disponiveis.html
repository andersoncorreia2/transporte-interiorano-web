<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Disponíveis | Transporte Interiorano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { azul: '#0056b3', verde: '#2e7d32', fundo: '#f5f5f5' } } } }
    </script>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <div class="bg-fundo w-full max-w-sm min-h-[700px] shadow-2xl relative flex flex-col overflow-hidden">
        
        <!-- Header (Idêntico ao App) -->
        <div class="bg-azul text-white p-4 flex items-center shadow-md z-10">
            <button onclick="window.location.href='painel.html'" class="hover:bg-blue-800 p-2 rounded-full transition mr-3">
                <i class="fa-solid fa-arrow-left text-xl"></i>
            </button>
            <h1 class="text-[20px] font-bold tracking-wide">Transporte Interiorano</h1>
        </div>

        <!-- Título da Tela -->
        <div class="px-5 py-4 bg-white z-0 border-b border-gray-100">
            <h2 class="text-xl font-bold text-gray-900">Eventos Disponíveis</h2>
        </div>

        <!-- Área dos Cards com Scroll -->
        <div id="listaEventos" class="flex-1 overflow-y-auto px-4 pb-6 pt-4 bg-fundo space-y-4">
            <!-- Loading Inicial -->
            <div id="loading" class="text-center py-10 text-azul">
                <i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i>
                <p class="font-bold">Buscando viagens programadas...</p>
            </div>
        </div>

        </div>

        <!-- 🟢 MODAL DE DETALHES DA CORRIDA (IGUAL AO ANDROID) -->
        <div id="modalDetalhes" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex flex-col items-center justify-end sm:justify-center p-0 sm:p-4 backdrop-blur-sm transition-opacity">
            <div class="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col max-h-[90vh] animate-slide-up">
                <div class="bg-azul p-4 flex items-center justify-between shadow-md z-10">
                    <h3 class="text-white font-bold text-[18px]">Detalhes da Corrida</h3>
                    <button onclick="fecharDetalhes()" class="text-white hover:text-gray-200 bg-white/20 rounded-full w-8 h-8 flex items-center justify-center transition">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div id="conteudoDetalhes" class="p-6 overflow-y-auto space-y-5 bg-gray-50">
                    <!-- Preenchido via JavaScript -->
                </div>
                <div class="p-5 border-t border-gray-200 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]" id="rodapeDetalhes">
                    <!-- Botão Confirmar Vaga -->
                </div>
            </div>
        </div>

    </div>

    <script>
        const BASE_URL = "https://transporte-interiorano-backend.onrender.com";
        const cpfLogado = localStorage.getItem('cpfLogado');

        if (!cpfLogado) {
            window.location.href = 'login.html';
        }

        window.onload = async function() {
            // 🟢 AVISA O BANCO QUE ENTROU NA MODALIDADE PROGRAMADA
            fetch(`${BASE_URL}/usuarios/alterar_modalidade`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('tokenSessao')}` },
                body: JSON.stringify({ modalidade: "Programada" })
            }).catch(e => console.error(e));

            const listaEventos = document.getElementById('listaEventos');
            const loading = document.getElementById('loading');
            const cpfLimpo = cpfLogado.replace(/\D/g, '');

            try {
                // 1. Busca viagens e solicitações do banco
                const resposta = await fetch(`${BASE_URL}/caronas/${cpfLimpo}`, { cache: 'no-store' });
                const caronas = await resposta.json();

                // SALVA NA MEMÓRIA PARA A TELA DE DETALHES CONSEGUIR LER O MOTORISTA
                window.listaCaronasGlobal = caronas; 

                const respostaSol = await fetch(`${BASE_URL}/solicitacoes`, { cache: 'no-store' });
                const todasSolicitacoes = await respostaSol.json();

                loading.classList.add('hidden');

                if (caronas.erro || caronas.length === 0) {
                    listaEventos.innerHTML = `
                        <div class="text-center py-12 text-gray-500">
                            <i class="fa-regular fa-calendar-xmark text-5xl mb-4 opacity-50"></i>
                            <p class="font-bold">Nenhum evento disponível no momento.</p>
                        </div>
                    `;
                    return;
                }

                // DESENHA OS CARDS
                caronas.forEach(carona => {
                    const pedidosDestaCarona = todasSolicitacoes.filter(s => s.carona_id === carona.id);
                    
                    const qtdOcupadas = pedidosDestaCarona.filter(s => {
                        const st = (s.status || "").toLowerCase();
                        return st.includes("aceito") || st.includes("pendente") || st.includes("taxa paga") || st.includes("carencia");
                    }).length;

                    const totalVagas = parseInt(carona.vagas) || 4;
                    const vagasRestantes = totalVagas - qtdOcupadas;
                    const esgotado = vagasRestantes <= 0;

                    const corVaga = esgotado ? "text-red-600" : "text-verde";
                    const textoVaga = esgotado ? "Lotação Esgotada" : `${vagasRestantes} Vagas Livres`;

                    // Verifica se EU já solicitei esta carona
                    const minhaSolicitacao = pedidosDestaCarona.find(s => 
                        (s.passageiro_cpf || "").replace(/\D/g, '') === cpfLimpo && 
                        !s.status.toLowerCase().includes("expirado") && 
                        !s.status.toLowerCase().includes("cancelada")
                    );

                    let botoesAcaoHTML = '';

                    // CONTROLE VISUAL E CRONÔMETRO (IDÊNTICO AO ANDROID)
                    if (minhaSolicitacao) {
                        const statusMeu = minhaSolicitacao.status.toLowerCase();
                        
                        if (statusMeu.includes("pendente")) {
                            let timerHTML = '';
                            if (minhaSolicitacao.data_criacao) {
                                // O span guarda a data de criação. O setInterval abaixo atualizará o valor dele.
                                timerHTML = `
                                    <div class="flex items-center gap-2 mt-4 mb-2">
                                        <i class="fa-regular fa-clock text-gray-500"></i>
                                        <span class="text-[13px] font-bold text-azul">Tempo restante para pagar:</span>
                                        <span class="text-[13px] font-black text-red-600" id="timer-${minhaSolicitacao.id}" data-criacao="${minhaSolicitacao.data_criacao}">--:--</span>
                                    </div>
                                `;
                            }

                            botoesAcaoHTML = `
                                ${timerHTML}
                                <div class="flex items-center justify-between mt-2 pt-3 border-t border-gray-100">
                                    <div>
                                        <p class="text-[10px] font-bold text-gray-500 uppercase">Status:</p>
                                        <p class="text-sm font-black text-yellow-500">Pendente ⏳</p>
                                    </div>
                                    <button onclick="cancelarMinhaSolicitacao(${minhaSolicitacao.id})" class="px-6 py-2 bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 font-bold rounded-full shadow-sm transition text-sm">
                                        Cancelar
                                    </button>
                                </div>
                            `;
                        } else if (statusMeu.includes("aceito") || statusMeu.includes("taxa paga")) {
                            botoesAcaoHTML = `
                                <button disabled class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl mt-2 shadow-md cursor-not-allowed">
                                    <i class="fa-solid fa-circle-check"></i> Vaga Garantida!
                                </button>
                            `;
                        }
                    } else {
                        // Se não tem solicitação, mostra botão original
                        botoesAcaoHTML = `
                            <button onclick="abrirDetalhes(${carona.id})" 
                                ${esgotado ? 'disabled' : ''}
                                class="w-full ${esgotado ? 'bg-gray-400 cursor-not-allowed' : 'bg-verde hover:bg-green-700'} text-white font-bold py-3.5 rounded-xl transition shadow-md flex justify-center items-center gap-2 mt-2">
                                ${esgotado ? 'Vagas Esgotadas' : 'Ver Detalhes e Solicitar <i class="fa-solid fa-arrow-right"></i>'}
                            </button>
                        `;
                    }

                    const cardHTML = `
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden relative mb-4">
                            <div class="p-4 flex items-center border-b border-gray-100 bg-gray-50/50">
                                <div class="w-12 h-12 rounded-full bg-gray-300 flex items-center justify-center text-gray-500 mr-4 shadow-inner">
                                    <i class="fa-solid fa-user text-xl"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-gray-900 text-lg leading-tight">${carona.motorista || 'Motorista Parceiro'}</h3>
                                </div>
                            </div>
                            <div class="p-4 space-y-3">
                                <div class="flex items-start gap-3">
                                    <i class="fa-solid fa-bullseye text-red-500 mt-1"></i>
                                    <div><p class="font-bold text-azul text-sm">Evento: ${carona.evento_nome}</p></div>
                                </div>
                                <div class="flex items-start gap-3">
                                    <i class="fa-solid fa-location-dot text-red-500 mt-1 ml-0.5"></i>
                                    <div>
                                        <p class="font-bold text-gray-900 text-[15px]">Origem: ${carona.cidade_origem}</p>
                                        <p class="text-sm text-gray-600">${carona.endereco_origem || ''}</p>
                                    </div>
                                </div>
                                <div class="flex items-start gap-3">
                                    <i class="fa-solid fa-flag-checkered text-gray-600 mt-1"></i>
                                    <div>
                                        <p class="font-bold text-gray-900 text-[15px]">Destino: ${carona.cidade_destino}</p>
                                        <p class="text-sm text-gray-600">${carona.endereco_destino || ''}</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-3 text-red-500 font-bold text-sm pt-1">
                                    <i class="fa-regular fa-clock"></i> Partida: ${carona.horario}
                                </div>
                                <div class="flex items-center gap-3 ${corVaga} font-bold text-sm">
                                    <i class="fa-solid fa-user-group text-blue-500"></i> ${textoVaga}
                                </div>
                                <div class="flex items-center gap-3 text-azul font-bold text-sm pb-2">
                                    <i class="fa-solid fa-sack-dollar text-yellow-500"></i> Valor Total: R$ ${parseFloat(carona.valor_corrida || 0).toFixed(2)}
                                </div>

                                <!-- Renderiza os botões dinâmicos e cronômetros -->
                                ${botoesAcaoHTML}
                            </div>
                        </div>
                    `;
                    listaEventos.innerHTML += cardHTML;
                });

            } catch (erro) {
                loading.innerHTML = `<p class="text-red-500 font-bold">Erro ao carregar os eventos.</p>`;
            }
        };

        // 🟢 LOOP DO CRONÔMETRO QUE RODA A CADA 1 SEGUNDO
        setInterval(() => {
            document.querySelectorAll('[id^="timer-"]').forEach(el => {
                const dataCriacaoStr = el.getAttribute('data-criacao');
                if(!dataCriacaoStr) return;
                
                // Converte a string do Python para timestamp, forçando o Fuso -03:00 de Brasília
                const dataCriacaoISO = dataCriacaoStr.includes('T') ? dataCriacaoStr : dataCriacaoStr.replace(' ', 'T');
                const criacaoMs = new Date(dataCriacaoISO + "-03:00").getTime();
                
                // Soma 15 minutos (900.000 ms)
                const limiteMs = criacaoMs + 900000;
                const agoraMs = new Date().getTime(); 
                
                const diff = limiteMs - agoraMs;
                
                if(diff > 0) {
                    const min = Math.floor(diff / 60000);
                    const sec = Math.floor((diff % 60000) / 1000);
                    el.textContent = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
                } else {
                    el.textContent = "00:00 (Expirando...)";
                }
            });
        }, 1000);

        // CANCELAR A SOLICITAÇÃO
        async function cancelarMinhaSolicitacao(idSolicitacao) {
            if (!confirm("Tem certeza que deseja cancelar o seu pedido?")) return;

            const token = localStorage.getItem('tokenSessao');
            try {
                const res = await fetch(`${BASE_URL}/solicitacoes/${idSolicitacao}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    alert("Sua solicitação foi cancelada com sucesso.");
                    window.location.reload(); 
                } else {
                    alert("Erro ao tentar cancelar. A solicitação pode já ter expirado.");
                }
            } catch (e) {
                alert("Falha de conexão com o servidor.");
            }
        }

        // 🟢 FUNÇÕES DO MODAL DE DETALHES (ANÁLISE DO MOTORISTA)
        async function abrirDetalhes(idCarona) {
            const carona = window.listaCaronasGlobal.find(c => c.id === idCarona);
            if(!carona) return;

            let corridas = carona.corridas_realizadas || 0;
            let passageiros = carona.passageiros_conduzidos || 0;

            // 🟢 FAZ A BUSCA EM TEMPO REAL DAS MÉTRICAS DO MOTORISTA (IDÊNTICO AO ANDROID)
            if (carona.motorista_cpf) {
                try {
                    const resMetricas = await fetch(`${BASE_URL}/usuarios_por_cpf/${carona.motorista_cpf}`);
                    if (resMetricas.ok) {
                        const metricas = await resMetricas.json();
                        corridas = metricas.corridas_realizadas || 0;
                        passageiros = metricas.passageiros_conduzidos || 0;
                    }
                } catch (e) {
                    console.error("Erro ao buscar métricas:", e);
                }
            }

            const valorTotal = parseFloat(carona.valor_corrida || 0);

            const conteudo = `
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-50 text-azul flex items-center justify-center"><i class="fa-solid fa-location-dot"></i></div>
                    <div>
                        <p class="text-[11px] text-gray-500 font-bold uppercase">Origem</p>
                        <p class="font-bold text-gray-900">${carona.cidade_origem}</p>
                        <p class="text-[13px] text-gray-600">${carona.endereco_origem}</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-green-50 text-verde flex items-center justify-center"><i class="fa-solid fa-location-dot"></i></div>
                    <div>
                        <p class="text-[11px] text-gray-500 font-bold uppercase">Destino</p>
                        <p class="font-bold text-gray-900">${carona.cidade_destino}</p>
                        <p class="text-[13px] text-gray-600">${carona.endereco_destino}</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center"><i class="fa-regular fa-clock"></i></div>
                    <div>
                        <p class="text-[11px] text-gray-500 font-bold uppercase">Horário</p>
                        <p class="font-bold text-gray-900">${carona.horario}</p>
                    </div>
                </div>

                <div class="flex items-center gap-3 bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                    <div class="w-12 h-12 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center text-xl"><i class="fa-solid fa-user"></i></div>
                    <div>
                        <p class="text-[11px] text-gray-500 font-bold uppercase">Motorista</p>
                        <p class="font-bold text-gray-900 leading-tight">${carona.motorista}</p>
                        <p class="text-[12px] text-gray-600 mt-1"><i class="fa-solid fa-car text-azul"></i> Corridas: <span class="font-bold">${corridas}</span></p>
                        <p class="text-[12px] text-gray-600"><i class="fa-solid fa-users text-verde"></i> Passageiros: <span class="font-bold">${passageiros}</span></p>
                    </div>
                </div>

                <div class="flex items-center justify-between mt-2">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-sack-dollar text-2xl text-gray-400"></i>
                        <p class="text-sm text-gray-500 font-bold uppercase mt-1">Valor Total</p>
                    </div>
                    <p class="font-black text-xl text-azul">R$ ${valorTotal.toFixed(2)}</p>
                </div>
            `;

            document.getElementById('conteudoDetalhes').innerHTML = conteudo;
            document.getElementById('rodapeDetalhes').innerHTML = `
                <button onclick="solicitarVaga(${carona.id})" class="w-full bg-verde hover:bg-green-700 text-white font-bold py-4 rounded-xl transition shadow-lg flex justify-center items-center gap-2 text-[16px]">
                    Confirmar Vaga <i class="fa-solid fa-check"></i>
                </button>
            `;
            document.getElementById('modalDetalhes').classList.remove('hidden');
        }

        function fecharDetalhes() {
            document.getElementById('modalDetalhes').classList.add('hidden');
        }

        // =========================================================================
        // FUNÇÕES DO PIX COM O NOVO DESIGN
        // =========================================================================
        async function solicitarVaga(idCarona) {
            fecharDetalhes(); // FECHA A TELA DE DETALHES ANTES DE ABRIR O PIX

            const token = localStorage.getItem('tokenSessao');
            if (!token) {
                alert("Sua sessão expirou. Faça login novamente.");
                window.location.href = 'login.html';
                return;
            }

            try {
                const resPermissao = await fetch(`${BASE_URL}/pagamentos/programado/verificar_permissao`, { headers: { 'Authorization': `Bearer ${token}` } });
                const jsonPermissao = await resPermissao.json();
                if (jsonPermissao.bloqueado) {
                    alert("🚨 " + jsonPermissao.mensagem);
                    return;
                }
            } catch (e) { alert("Erro ao verificar status da conta."); return; }

            let permiteTaxa = false;
            let valorTotal = 0.0;
            try {
                const resPrazo = await fetch(`${BASE_URL}/caronas/verificar_prazo_reserva/${idCarona}`);
                const jsonPrazo = await resPrazo.json();
                if (jsonPrazo.erro) { alert(jsonPrazo.erro); return; }
                permiteTaxa = jsonPrazo.permite_taxa_reserva;
                valorTotal = jsonPrazo.valor_total;
            } catch (e) { alert("Erro de comunicação."); return; }

            let endpoint = "";
            let payload = { carona_id: idCarona };

            if (permiteTaxa) {
                const pagarTaxa = confirm(`Esta viagem está a mais de 72h de distância!\n\nVocê deseja pagar apenas a TAXA DE RESERVA (R$ 5,00) agora e o restante depois?\n\n- Clique em [OK] para pagar só a taxa.\n- Clique em [Cancelar] para pagar o Valor Total (R$ ${valorTotal.toFixed(2)}).`);
                if (pagarTaxa) {
                    endpoint = "/pagamentos/programado/gerar_taxa";
                } else {
                    endpoint = "/pagamentos/programado/gerar_checkout";
                    payload.valor_total = valorTotal;
                }
            } else {
                const confirmar = confirm(`Esta viagem ocorrerá em breve (menos de 72h).\nÉ exigido o pagamento INTEGRAL (R$ ${valorTotal.toFixed(2)}) para garantir a vaga.\n\nDeseja gerar o Pix agora?`);
                if (!confirmar) return;
                endpoint = "/pagamentos/programado/gerar_checkout";
                payload.valor_total = valorTotal;
            }

            try {
                const modalLoading = document.createElement('div');
                modalLoading.innerHTML = `<div class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center"><p class="text-white font-bold text-xl"><i class="fa-solid fa-spinner fa-spin"></i> Gerando Pix...</p></div>`;
                document.body.appendChild(modalLoading);

                const resPix = await fetch(`${BASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });

                const jsonPix = await resPix.json();
                modalLoading.remove();

                if (resPix.ok || resPix.status === 201) {
                    mostrarModalPixWeb(jsonPix.pix_copia_cola);
                } else {
                    alert("Erro ao gerar Pix: " + (jsonPix.erro || "Falha."));
                }
            } catch (erro) { alert("Falha na conexão."); }
        }

        // 🟢 NOVO DESIGN DO MODAL PIX (COM BOTÃO VERMELHO)
        function mostrarModalPixWeb(codigoPix) {
            const modalAntigo = document.getElementById('modalPixWeb');
            if(modalAntigo) modalAntigo.remove();

            const html = `
                <div id="modalPixWeb" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                    <div class="bg-gray-100 rounded-3xl shadow-2xl p-6 w-full max-w-sm text-center relative border border-gray-200">
                        <h3 class="text-xl font-bold text-azul mb-2">Pague o Pix 📱</h3>
                        <p class="text-sm text-gray-600 mb-4 leading-snug">Copie o código abaixo e pague no aplicativo do seu banco para garantir sua vaga:</p>
                        
                        <div class="relative text-left mb-6">
                            <span class="absolute -top-2 left-3 bg-gray-100 px-1 text-[10px] text-gray-500 font-bold">Pix Copia e Cola</span>
                            <textarea id="textoPixArea" readonly class="w-full bg-white border border-gray-300 rounded-xl p-3 text-xs text-gray-700 h-24 resize-none outline-none focus:border-azul transition">${codigoPix}</textarea>
                        </div>
                        
                        <button onclick="copiarPixWeb()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-full mb-3 shadow-md transition hover:bg-blue-700 flex items-center justify-center gap-2">
                            Copiar Código Pix 📋
                        </button>
                        <button onclick="document.getElementById('modalPixWeb').remove(); window.location.reload();" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-full mb-3 shadow-md transition flex items-center justify-center gap-2">
                            Já Paguei / Verificar ⚡
                        </button>
                        <button onclick="document.getElementById('modalPixWeb').remove(); window.location.reload();" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-full shadow-md transition flex items-center justify-center gap-2">
                            Fechar / Pagar Depois ❌
                        </button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function copiarPixWeb() {
            const area = document.getElementById('textoPixArea');
            area.select();
            document.execCommand('copy'); 
            navigator.clipboard.writeText(area.value).catch(()=>{});
            alert('✅ Código Pix copiado! Abra o app do seu banco.');
        }
    </script>
</body>
</html>
