<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Disponíveis | Transporte Interiorano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { azul: '#0056b3', verde: '#2e7d32', fundo: '#f5f5f5' } } } }
    </script>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <div class="bg-fundo w-full max-w-sm min-h-[700px] shadow-2xl relative flex flex-col overflow-hidden">
        
        <!-- Header (Idêntico ao App) -->
        <div class="bg-azul text-white p-4 flex items-center shadow-md z-10">
            <button onclick="window.location.href='painel.html'" class="hover:bg-blue-800 p-2 rounded-full transition mr-3">
                <i class="fa-solid fa-arrow-left text-xl"></i>
            </button>
            <h1 class="text-[20px] font-bold tracking-wide">Transporte Interiorano</h1>
        </div>

        <!-- Título da Tela -->
        <div class="px-5 py-4 bg-white z-0 border-b border-gray-100">
            <h2 class="text-xl font-bold text-gray-900">Eventos Disponíveis</h2>
        </div>

        <!-- Área dos Cards com Scroll -->
        <div id="listaEventos" class="flex-1 overflow-y-auto px-4 pb-6 pt-4 bg-fundo space-y-4">
            <!-- Loading Inicial -->
            <div id="loading" class="text-center py-10 text-azul">
                <i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i>
                <p class="font-bold">Buscando viagens programadas...</p>
            </div>
        </div>

    </div>

    <script>
        const BASE_URL = "https://transporte-interiorano-backend.onrender.com"; 
        const cpfLogado = localStorage.getItem('cpfLogado');

        if (!cpfLogado) {
            window.location.href = 'login.html';
        }

        window.onload = async function() {
            const listaEventos = document.getElementById('listaEventos');
            const loading = document.getElementById('loading');

            try {
                // 1. Busca as viagens ativas
                const resposta = await fetch(`${BASE_URL}/caronas/${encodeURIComponent(cpfLogado)}`, { cache: 'no-store' });
                const caronas = await resposta.json();

                // 2. Busca todas as solicitações para fazer a matemática das vagas
                const respostaSol = await fetch(`${BASE_URL}/solicitacoes`, { cache: 'no-store' });
                const todasSolicitacoes = await respostaSol.json();

                loading.classList.add('hidden');

                if (caronas.erro || caronas.length === 0) {
                    listaEventos.innerHTML = `
                        <div class="text-center py-12 text-gray-500">
                            <i class="fa-regular fa-calendar-xmark text-5xl mb-4 opacity-50"></i>
                            <p class="font-bold">Nenhum evento disponível no momento.</p>
                            <p class="text-sm mt-2">Tente novamente mais tarde.</p>
                        </div>
                    `;
                    return;
                }

                // DESENHA OS CARDS
                caronas.forEach(carona => {
                    // 🟢 MATEMÁTICA DE VAGAS IDÊNTICA AO KOTLIN
                    const pedidosDestaCarona = todasSolicitacoes.filter(s => s.carona_id === carona.id);
                    
                    const qtdOcupadas = pedidosDestaCarona.filter(s => {
                        const st = (s.status || "").toLowerCase();
                        return st.includes("aceito") || st.includes("pendente") || st.includes("taxa paga") || st.includes("carencia");
                    }).length;

                    const totalVagas = parseInt(carona.vagas) || 4;
                    const vagasRestantes = totalVagas - qtdOcupadas;
                    const esgotado = vagasRestantes <= 0;

                    // Ajuste de cores baseado na lotação
                    const corVaga = esgotado ? "text-red-600" : "text-verde";
                    const textoVaga = esgotado ? "Lotação Esgotada" : `${vagasRestantes} Vagas Livres`;

                    const cardHTML = `
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden relative mb-4">
                            <div class="p-4 flex items-center border-b border-gray-100 bg-gray-50/50">
                                <div class="w-12 h-12 rounded-full bg-gray-300 flex items-center justify-center text-gray-500 mr-4 shadow-inner">
                                    <i class="fa-solid fa-user text-xl"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-gray-900 text-lg leading-tight">${carona.motorista || 'Motorista Parceiro'}</h3>
                                    <div class="flex items-center text-yellow-500 text-xs font-bold mt-1 gap-1">
                                        <i class="fa-solid fa-star"></i>
                                        <span class="text-gray-700">Novo Parceiro</span>
                                    </div>
                                </div>
                            </div>

                            <div class="p-4 space-y-3">
                                <div class="flex items-start gap-3">
                                    <i class="fa-solid fa-bullseye text-red-500 mt-1"></i>
                                    <div>
                                        <p class="font-bold text-azul text-sm">Evento: ${carona.evento_nome}</p>
                                    </div>
                                </div>
                                
                                <div class="flex items-start gap-3">
                                    <i class="fa-solid fa-location-dot text-red-500 mt-1 ml-0.5"></i>
                                    <div>
                                        <p class="font-bold text-gray-900 text-[15px]">Origem: ${carona.cidade_origem}</p>
                                        <p class="text-sm text-gray-600">${carona.endereco_origem || ''}</p>
                                    </div>
                                </div>

                                <div class="flex items-start gap-3">
                                    <i class="fa-solid fa-flag-checkered text-gray-600 mt-1"></i>
                                    <div>
                                        <p class="font-bold text-gray-900 text-[15px]">Destino: ${carona.cidade_destino}</p>
                                        <p class="text-sm text-gray-600">${carona.endereco_destino || ''}</p>
                                    </div>
                                </div>

                                <div class="flex items-center gap-3 text-red-500 font-bold text-sm pt-1">
                                    <i class="fa-regular fa-clock"></i>
                                    Partida: ${carona.horario}
                                </div>

                                <div class="flex items-center gap-3 ${corVaga} font-bold text-sm">
                                    <i class="fa-solid fa-user-group text-blue-500"></i>
                                    ${textoVaga}
                                </div>

                                <div class="flex items-center gap-3 text-azul font-bold text-sm pb-2">
                                    <i class="fa-solid fa-sack-dollar text-yellow-500"></i>
                                    Valor Total: R$ ${parseFloat(carona.valor_corrida || 0).toFixed(2)}
                                </div>

                                <button onclick="solicitarVaga(${carona.id})" 
                                    ${esgotado ? 'disabled' : ''}
                                    class="w-full ${esgotado ? 'bg-gray-400 cursor-not-allowed' : 'bg-verde hover:bg-green-700'} text-white font-bold py-3.5 rounded-xl transition shadow-md flex justify-center items-center gap-2 mt-2">
                                    ${esgotado ? 'Vagas Esgotadas' : 'Solicitar Vaga <i class="fa-solid fa-car-side"></i>'}
                                </button>
                            </div>
                        </div>
                    `;
                    listaEventos.innerHTML += cardHTML;
                });

            } catch (erro) {
                loading.innerHTML = `<p class="text-red-500 font-bold">Erro ao conectar com o banco de dados.</p>`;
            }
        };

        // =========================================================================
        // 🟢 NOVO FLUXO FINANCEIRO: SOLICITAÇÃO COM PIX INTEGRADO
        // =========================================================================
        async function solicitarVaga(idCarona) {
            const token = localStorage.getItem('tokenSessao');
            if (!token) {
                alert("Sua sessão expirou. Faça login novamente.");
                window.location.href = 'login.html';
                return;
            }

            // 1. Verifica se o passageiro está bloqueado por calote anterior
            try {
                const resPermissao = await fetch(`${BASE_URL}/pagamentos/programado/verificar_permissao`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const jsonPermissao = await resPermissao.json();
                if (jsonPermissao.bloqueado) {
                    alert("🚨 " + jsonPermissao.mensagem);
                    return;
                }
            } catch (e) {
                alert("Erro ao verificar status da conta.");
                return;
            }

            // 2. Verifica as regras de prazo (Permite taxa de R$ 5,00 ou exige integral?)
            let permiteTaxa = false;
            let valorTotal = 0.0;
            try {
                const resPrazo = await fetch(`${BASE_URL}/caronas/verificar_prazo_reserva/${idCarona}`);
                const jsonPrazo = await resPrazo.json();
                
                if (jsonPrazo.erro) {
                    alert(jsonPrazo.erro);
                    return;
                }
                permiteTaxa = jsonPrazo.permite_taxa_reserva;
                valorTotal = jsonPrazo.valor_total;
            } catch (e) {
                alert("Erro ao verificar as regras de prazo da carona.");
                return;
            }

            // 3. Define a rota e o payload baseado na escolha do usuário
            let endpoint = "";
            let payload = { carona_id: idCarona };

            if (permiteTaxa) {
                const pagarTaxa = confirm(`Esta viagem está a mais de 72h de distância!\n\nVocê deseja pagar apenas a TAXA DE RESERVA (R$ 5,00) agora e o restante depois?\n\n- Clique em [OK] para pagar só a taxa.\n- Clique em [Cancelar] para pagar o Valor Total (R$ ${valorTotal.toFixed(2)}).`);
                
                if (pagarTaxa) {
                    endpoint = "/pagamentos/programado/gerar_taxa";
                } else {
                    endpoint = "/pagamentos/programado/gerar_checkout";
                    payload.valor_total = valorTotal;
                }
            } else {
                const confirmar = confirm(`Esta viagem ocorrerá em breve (menos de 72h).\nÉ exigido o pagamento INTEGRAL (R$ ${valorTotal.toFixed(2)}) para garantir a vaga.\n\nDeseja gerar o Pix agora?`);
                if (!confirmar) return;
                
                endpoint = "/pagamentos/programado/gerar_checkout";
                payload.valor_total = valorTotal;
            }

            // 4. Gera o PIX (O backend Python cria a solicitação automaticamente aqui!)
            try {
                // Alerta de carregamento
                const modalLoading = document.createElement('div');
                modalLoading.innerHTML = `<div class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center"><p class="text-white font-bold text-xl"><i class="fa-solid fa-spinner fa-spin"></i> Gerando Pix Mercado Pago...</p></div>`;
                document.body.appendChild(modalLoading);

                const resPix = await fetch(`${BASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify(payload)
                });

                const jsonPix = await resPix.json();
                modalLoading.remove(); // Remove o aviso de loading

                if (resPix.ok || resPix.status === 201) {
                    // Chama a função que desenha a tela bonita do Pix (abaixo)
                    mostrarModalPixWeb(jsonPix.pix_copia_cola);
                } else {
                    alert("Erro ao gerar Pix: " + (jsonPix.erro || "Verifique se você já solicitou esta viagem."));
                }
            } catch (erro) {
                console.error(erro);
                alert("Falha de conexão com o servidor de pagamentos.");
            }
        }

        // =========================================================================
        // 🟢 DESENHA O MODAL DE PAGAMENTO PIX NA TELA (ESTILO APLICATIVO)
        // =========================================================================
        function mostrarModalPixWeb(codigoPix) {
            const modalAntigo = document.getElementById('modalPixWeb');
            if(modalAntigo) modalAntigo.remove();

            const html = `
                <div id="modalPixWeb" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm text-center relative border border-gray-100">
                        <h3 class="text-2xl font-black text-azul mb-2">⚡ Pague para Reservar</h3>
                        <p class="text-sm text-gray-600 mb-5 leading-snug">Sua vaga está pendente. Copie o código abaixo e cole no seu banco (Área Pix Copia e Cola) para garantir seu lugar!</p>
                        
                        <textarea id="textoPixArea" readonly class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl p-3 text-xs text-gray-600 mb-4 h-24 resize-none outline-none focus:border-azul transition">${codigoPix}</textarea>
                        
                        <button onclick="copiarPixWeb()" class="w-full bg-azul text-white font-bold py-3.5 rounded-xl mb-3 shadow-md transition hover:bg-blue-700 flex items-center justify-center gap-2">
                            <i class="fa-regular fa-copy text-lg"></i> Copiar Código Pix
                        </button>
                        <button onclick="document.getElementById('modalPixWeb').remove(); window.location.reload();" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                            Já Paguei / Fechar <i class="fa-solid fa-check"></i>
                        </button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function copiarPixWeb() {
            const area = document.getElementById('textoPixArea');
            area.select();
            document.execCommand('copy'); // Mantém o suporte a navegadores antigos
            navigator.clipboard.writeText(area.value).catch(()=>{});
            alert('✅ Código Pix copiado! Abra o app do seu banco.');
        }
    </script>
</body>
</html>
