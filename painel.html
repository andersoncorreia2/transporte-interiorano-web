<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel | Transporte Interiorano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { azul: '#0F52BA', verde: '#2ECC71' } }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Navbar do Painel -->
    <header class="bg-azul text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-car-side"></i> Transporte Interiorano
        </div>
        <div class="flex gap-4">
            <a href="emergencial.html" class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 px-4 py-2 rounded-lg font-bold text-sm transition shadow">
                <i class="fa-solid fa-bolt"></i> Chamado Expresso
            </a>
            <button onclick="fazerLogout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-bold text-sm transition shadow">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container mx-auto max-w-4xl px-6 py-10">
        
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-8 flex items-center gap-4">
            <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center text-azul text-2xl">
                <i class="fa-solid fa-user"></i>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Olá, <span id="nomeUsuario">Passageiro</span>! 👋</h2>
                <p class="text-gray-500">Bem-vindo(a) ao seu painel web.</p>
            </div>
        </div>

        <h3 class="text-xl font-bold text-gray-800 mb-4">Corridas Programadas Disponíveis</h3>
        
        <!-- Local onde as caronas do banco de dados vão aparecer -->
        <div id="listaCaronas" class="grid md:grid-cols-2 gap-6">
            <p class="text-gray-500 col-span-2 text-center py-10"><i class="fa-solid fa-spinner fa-spin text-azul text-2xl"></i> Buscando viagens...</p>
        </div>

    </main>

    <!-- 🟢 SCRIPT MÁGICO DO PAINEL -->
    <script>
        // Mesma URL do seu servidor Render
        const BASE_URL = "https://transporte-interiorano-backend.onrender.com"; 

        // 1. Tenta pegar o Token e o Nome que o login.html salvou na memória
        const token = localStorage.getItem('tokenSessao');
        const cpf = localStorage.getItem('cpfLogado');
        const nome = localStorage.getItem('nomeLogado');

        // 2. Trava de Segurança: Se não tiver token, expulsa de volta pro Login
        if (!token) {
            window.location.href = 'login.html';
        }

        // 3. Mostra o nome do usuário na tela
        if (nome) {
            document.getElementById('nomeUsuario').textContent = nome.split(' ')[0]; // Pega só o primeiro nome
        }

        // 4. Função para deslogar
        function fazerLogout() {
            localStorage.clear(); // Apaga o token
            window.location.href = 'login.html';
        }

        // 5. Função que puxa as viagens do servidor Python usando o Token
        async function carregarCaronas() {
            try {
                // Chama a mesma rota que o Kotlin usa no BancoDeDados.kt
                const resposta = await fetch(`${BASE_URL}/caronas/${cpf}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const caronas = await resposta.json();
                const divLista = document.getElementById('listaCaronas');

                if (caronas.length === 0) {
                    divLista.innerHTML = '<p class="text-gray-500 col-span-2 text-center py-10">Nenhuma viagem disponível na sua região no momento.</p>';
                    return;
                }

                // Desenha os "cartões" de viagem na tela
                let htmlCaronas = '';
                caronas.forEach(carona => {
                    const valor = carona.valor_corrida == "0.00" ? "Gratuito" : `R$ ${carona.valor_corrida}`;
                    const corValor = carona.valor_corrida == "0.00" ? "text-verde" : "text-azul";

                    htmlCaronas += `
                    <div class="bg-white p-5 rounded-xl shadow-md border border-gray-100 hover:shadow-lg transition">
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="font-bold text-lg text-gray-800"><i class="fa-solid fa-map-pin text-azul"></i> ${carona.evento_nome || 'Viagem'}</h3>
                            <span class="bg-blue-100 text-azul text-xs font-bold px-2 py-1 rounded">Vagas: ${carona.vagas}</span>
                        </div>
                        <p class="text-gray-600 text-sm mb-1"><strong>Origem:</strong> ${carona.cidade_origem}</p>
                        <p class="text-gray-600 text-sm mb-1"><strong>Destino:</strong> ${carona.cidade_destino}</p>
                        <p class="text-gray-600 text-sm mb-3"><strong>Partida:</strong> ${carona.horario}</p>
                        
                        <div class="mt-4 pt-4 border-t border-gray-100 flex justify-between items-center">
                            <span class="${corValor} font-bold text-lg">${valor}</span>
                            <button onclick="solicitarVaga(${carona.id})" class="bg-verde hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition shadow">
                                Solicitar Vaga <i class="fa-solid fa-arrow-right ml-1"></i>
                            </button>
                        </div>
                    </div>`;
                });

                divLista.innerHTML = htmlCaronas;

            } catch (erro) {
                console.error("Erro ao buscar caronas:", erro);
                document.getElementById('listaCaronas').innerHTML = '<p class="text-red-500 col-span-2 text-center py-10">Erro ao carregar as viagens.</p>';
            }
        }

        // 6. Roda a busca automaticamente ao abrir a página
        carregarCaronas();

        // 6. Função para solicitar a vaga
        async function solicitarVaga(caronaId) {
            // Confirmação para evitar cliques acidentais
            if (!confirm("Deseja realmente solicitar uma vaga nesta corrida?")) return;

            try {
                // Envia o pedido para o Python igual o Kotlin faz!
                const resposta = await fetch(`${BASE_URL}/solicitacoes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        carona_id: caronaId,
                        passageiro: nome,       // Variável salva do Login
                        passageiro_cpf: cpf     // Variável salva do Login
                    })
                });

                const dados = await resposta.json();

                if (resposta.ok || resposta.status === 201) {
                    alert("✅ Sucesso! O motorista foi notificado.");
                    // Atualiza a lista para a pessoa ver se as vagas diminuíram
                    carregarCaronas(); 
                } else {
                    alert("❌ Erro: " + (dados.erro || "Não foi possível solicitar a vaga."));
                }
            } catch (erro) {
                console.error("Erro ao solicitar vaga:", erro);
                alert("❌ Erro de comunicação com o servidor.");
            }
        }
    </script>
</body>
</html>
