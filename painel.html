<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel | Transporte Interiorano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    colors: { 
                        azul: '#0056b3', /* Cor exata do botão Viagem Programada do app */
                        verde: '#2e7d32', /* Cor exata do botão Corrida Emergencial do app */
                        fundo: '#f5f5f5'
                    } 
                }
            }
        }
    </script>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <!-- Container simulando a tela do celular -->
    <div class="bg-fundo w-full max-w-sm min-h-[700px] shadow-2xl relative overflow-hidden flex flex-col">
        
        <!-- Header / Topbar simulado (igual ao Android) -->
        <div class="bg-fundo p-4 flex items-center">
            <button onclick="logout()" class="text-azul hover:text-blue-800 transition">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
        </div>

        <!-- Conteúdo Principal -->
        <div class="flex-1 px-6 py-2 flex flex-col items-center">
            
            <h2 class="text-[22px] font-bold text-azul mb-8 text-center tracking-tight">
                Como deseja viajar hoje?
            </h2>

            <!-- Saudação Dinâmica (Opcional, mas legal para o MVP) -->
            <p id="saudacao" class="text-sm text-gray-500 font-semibold mb-6 w-full text-center hidden"></p>

            <!-- Botões Menores -->
            <button onclick="alert('Funcionalidade Ver Perfil em desenvolvimento.')" 
                class="w-full bg-azul text-white font-bold py-3.5 rounded-[8px] mb-4 shadow-sm hover:bg-blue-700 transition">
                Ver Meu Perfil
            </button>

            <button onclick="alert('Funcionalidade Histórico em desenvolvimento.')" 
                class="w-full bg-white text-azul font-bold py-3.5 rounded-[8px] border border-gray-300 mb-6 shadow-sm hover:bg-gray-50 transition">
                Ver Histórico de Viagens
            </button>

            <!-- Botão Grande: Viagem Programada -->
            <button onclick="abrirViagemProgramada()" 
                class="w-full bg-azul text-white rounded-xl p-5 mb-4 shadow-md text-left flex flex-col items-center justify-center hover:bg-blue-700 transition transform hover:scale-[1.02]">
                <div class="flex items-center gap-2 mb-2">
                    <i class="fa-regular fa-calendar text-xl"></i>
                    <span class="text-lg font-bold">Viagem Programada</span>
                </div>
                <p class="text-center text-[12px] text-blue-100 font-medium px-2 leading-tight">
                    Agende caronas para o interior ou eventos com antecedência.
                </p>
            </button>

            <!-- Botão Grande: Corrida Emergencial -->
            <button onclick="abrirCorridaEmergencial()" 
                class="w-full bg-verde text-white rounded-xl p-5 shadow-md text-left flex flex-col items-center justify-center hover:bg-green-800 transition transform hover:scale-[1.02]">
                <div class="flex items-center gap-2 mb-2">
                    <i class="fa-solid fa-bolt text-yellow-400 text-xl"></i>
                    <span class="text-lg font-bold">Corrida Emergencial</span>
                </div>
                <p class="text-center text-[12px] text-green-100 font-medium px-2 leading-tight">
                    Precisa sair agora? Encontre motoristas nos bairros próximos.
                </p>
            </button>

        </div>
    </div>

    <script>
        // Lógica simples de navegação baseada no LocalStorage para mostrar o nome
        window.onload = function() {
            const nomeLogado = localStorage.getItem('nomeLogado');
            if(nomeLogado) {
                const pSaudacao = document.getElementById('saudacao');
                // Pega só o primeiro nome
                pSaudacao.textContent = `Olá, ${nomeLogado.split(' ')[0]}!`;
                pSaudacao.classList.remove('hidden');
            }
        };

        function logout() {
            if(confirm("Deseja sair da sua conta?")) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }

        function abrirViagemProgramada() {
            // No futuro, isso vai para viagens_programadas.html
            alert('Em breve: Tela com a lista de caronas agendadas!');
        }

        function abrirCorridaEmergencial() {
            // No futuro, isso vai para radar_emergencial.html
            alert('Em breve: Tela de solicitação de motoristas próximos!');
        }
    </script>
</body>
</html>
