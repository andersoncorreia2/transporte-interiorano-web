<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Viagens | Transporte Interiorano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { azul: '#0056b3', verdeSuave: '#E8F5E9', verdeForte: '#2E7D32', fundo: '#f5f5f5' } } } }
    </script>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <div class="bg-white w-full max-w-sm min-h-[700px] shadow-2xl relative flex flex-col overflow-hidden">
        
        <!-- Header -->
        <div class="bg-azul text-white p-4 flex items-center shadow-md z-10">
            <button onclick="window.location.href='painel.html'" class="hover:bg-blue-800 p-2 rounded-full transition mr-3">
                <i class="fa-solid fa-arrow-left text-xl"></i>
            </button>
            <h1 class="text-[20px] font-bold tracking-wide">Histórico de Viagens</h1>
        </div>

        <!-- Área dos Cards com Scroll -->
        <div id="listaHistorico" class="flex-1 overflow-y-auto px-4 py-6 bg-white space-y-4">
            <!-- Loading Inicial -->
            <div id="loading" class="text-center py-10 text-azul">
                <i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i>
                <p class="font-bold">Buscando seu histórico...</p>
            </div>
        </div>

    </div>

    <script>
        const BASE_URL = "https://transporte-interiorano-backend.onrender.com"; 
        const cpfLogado = localStorage.getItem('cpfLogado');

        if (!cpfLogado) window.location.href = 'login.html';

        window.onload = async function() {
            const lista = document.getElementById('listaHistorico');
            const loading = document.getElementById('loading');

            try {
                // Busca primeiro o usuário para saber se é motorista ou passageiro
                const respUser = await fetch(`${BASE_URL}/usuarios_por_cpf/${cpfLogado}`);
                const user = await respUser.json();
                const isMotorista = user.veiculo && user.veiculo.trim() !== "";

                // Chama a rota de histórico correto com base no tipo de usuário
                const rota = isMotorista ? 'historico_motorista' : 'historico_passageiro';
                const resposta = await fetch(`${BASE_URL}/corridas/emergentes/${rota}/${cpfLogado}`);
                const corridas = await resposta.json();

                loading.classList.add('hidden');

                if (corridas.erro || corridas.length === 0) {
                    lista.innerHTML = `
                        <div class="text-center py-12 text-gray-500">
                            <p class="font-bold">Nenhuma viagem finalizada ainda.</p>
                        </div>
                    `;
                    return;
                }

                // Desenha os cards verdes baseados na image_2f8663.png
                corridas.forEach(corrida => {
                    
                    // Cálculo simplificado de tempo para o front-end (assumindo formato DD/MM/YYYY HH:mm)
                    let tempoViagem = "-- min";
                    try {
                        if(corrida.data_criacao && corrida.data_finalizacao) {
                            const [d1, t1] = corrida.data_criacao.split(' ');
                            const [d2, t2] = corrida.data_finalizacao.split(' ');
                            
                            const [dia1, mes1, ano1] = d1.split('/');
                            const [dia2, mes2, ano2] = d2.split('/');

                            const start = new Date(`${ano1}-${mes1}-${dia1}T${t1}:00Z`).getTime();
                            const end = new Date(`${ano2}-${mes2}-${dia2}T${t2}:00Z`).getTime();

                            const diffMin = Math.round((end - start) / 60000);
                            if(diffMin > 0) tempoViagem = diffMin > 60 ? `${Math.floor(diffMin/60)}h ${diffMin%60}m` : `${diffMin} min`;
                        }
                    } catch(e){}

                    const cardHTML = `
                        <div class="bg-verdeSuave rounded-xl p-4 shadow-sm">
                            <h3 class="font-bold text-verdeForte text-[16px] mb-2 flex items-center justify-between">
                                <span>Corrida Emergencial ⚡</span>
                                ${isMotorista ? `<span class="text-[11px] text-gray-600 font-normal">Passageiro: ${corrida.passageiro_nome || 'N/A'}</span>` : ''}
                            </h3>
                            
                            <p class="text-[14px] font-bold text-gray-900 mb-3 leading-snug">
                                De: <span class="font-normal">${corrida.endereco_origem}</span> para <span class="font-normal">${corrida.endereco_destino}</span>
                            </p>

                            <div class="bg-[#d5ecd8] rounded-lg p-3 mb-3">
                                <p class="text-[13px] text-gray-700 mb-1"><i class="fa-regular fa-clock text-gray-500 w-4"></i> Início: ${corrida.data_criacao}</p>
                                <p class="text-[13px] text-gray-700 mb-2"><i class="fa-solid fa-flag-checkered text-gray-500 w-4"></i> Fim: ${corrida.data_finalizacao}</p>
                                <p class="text-[13px] font-bold text-verdeForte"><i class="fa-solid fa-stopwatch text-gray-500 w-4"></i> Tempo de Viagem: ${tempoViagem}</p>
                            </div>

                            <p class="text-[#388E3C] font-bold text-[13px]">Status: Finalizada ✅</p>
                        </div>
                    `;
                    lista.innerHTML += cardHTML;
                });

            } catch (erro) {
                loading.innerHTML = `<p class="text-red-500 font-bold">Erro ao carregar o histórico.</p>`;
            }
        };
    </script>
</body>
</html>
