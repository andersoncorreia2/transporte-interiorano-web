<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamar Corrida | Transporte Interiorano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { azul: '#0056b3', verde: '#2e7d32', fundo: '#f5f5f5' } } } }
    </script>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <div class="bg-fundo w-full max-w-sm min-h-[700px] shadow-2xl relative flex flex-col overflow-hidden">
        
        <!-- Header -->
        <div class="bg-azul text-white p-4 flex items-center shadow-md z-10">
            <button onclick="window.location.href='painel.html'" class="hover:bg-blue-800 p-2 rounded-full transition mr-3">
                <i class="fa-solid fa-arrow-left text-xl"></i>
            </button>
            <h1 class="text-[20px] font-bold tracking-wide">Chamar Corrida</h1>
        </div>

        <div class="p-4 flex-1 flex flex-col relative">
            
            <!-- 🟢 TELA 1: FORMULÁRIO DE CHAMADA -->
            <div id="telaFormulario" class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex-1 flex flex-col">
                <h2 class="text-xl font-bold text-azul mb-1">Para onde você vai? 📍</h2>
                <p class="text-xs text-gray-500 mb-6">Solicite um motorista parceiro próximo a você.</p>

                <div class="space-y-4 mb-6">
                    <div class="relative">
                        <label class="text-xs font-bold text-gray-600 mb-1 block">Ponto de Partida</label>
                        <div class="relative">
                            <i class="fa-solid fa-location-crosshairs absolute left-3 top-3.5 text-blue-500"></i>
                            <input type="text" id="origem" placeholder="Ex: Rua da Aurora, Recife" class="w-full border border-gray-300 rounded-lg p-3 pl-10 text-gray-900 outline-none focus:border-azul text-sm font-medium">
                        </div>
                    </div>

                    <div class="relative">
                        <label class="text-xs font-bold text-gray-600 mb-1 block">Destino Final</label>
                        <div class="relative">
                            <i class="fa-solid fa-flag-checkered absolute left-3 top-3.5 text-green-500"></i>
                            <input type="text" id="destino" placeholder="Ex: Shopping Tacaruna" class="w-full border border-gray-300 rounded-lg p-3 pl-10 text-gray-900 outline-none focus:border-azul text-sm font-medium">
                        </div>
                    </div>
                </div>

                <label class="text-xs font-bold text-gray-600 mb-2 block">Para você</label>
                <div class="flex gap-3 mb-6">
                    <button id="btnCarro" onclick="selecionarVeiculo('Carro')" class="flex-1 bg-blue-50 border-2 border-azul rounded-xl p-4 flex flex-col items-center justify-center transition">
                        <span class="text-2xl mb-1">🚗</span>
                        <span class="font-bold text-gray-800 text-sm">Carro</span>
                    </button>
                    <button id="btnMoto" onclick="selecionarVeiculo('Moto')" class="flex-1 bg-white border-2 border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center transition">
                        <span class="text-2xl mb-1">🏍️</span>
                        <span class="font-bold text-gray-800 text-sm">Moto</span>
                    </button>
                </div>

                <div onclick="document.getElementById('modalPagamento').classList.remove('hidden')" class="bg-gray-50 border border-gray-200 rounded-xl p-4 flex justify-between items-center cursor-pointer mb-6 hover:bg-gray-100 transition">
                    <div class="flex items-center gap-3">
                        <span id="iconePagamento" class="text-xl">💵</span>
                        <span id="textoPagamento" class="font-bold text-gray-800">Dinheiro</span>
                    </div>
                    <span class="text-azul font-bold text-sm">Alterar ></span>
                </div>

                <div class="flex-1"></div>

                <button onclick="solicitarCorrida()" class="w-full bg-verde hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bolt"></i> Chamar <span id="textoBtnVeiculo">Carro</span> Agora
                </button>
            </div>

            <!-- 🟢 TELA 2: MONITORAMENTO EM TEMPO REAL -->
            <div id="telaMonitoramento" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex-1 flex flex-col justify-center text-center">
                <div id="iconeMonitoramento" class="text-6xl text-azul mb-4"><i class="fa-solid fa-radar fa-spin"></i></div>
                <h2 id="tituloMonitoramento" class="text-2xl font-black text-gray-900 mb-2">Procurando Motorista...</h2>
                <p id="subtituloMonitoramento" class="text-sm text-gray-500 mb-6">Avisando parceiros nas proximidades.</p>
                
                <!-- CARD DO MOTORISTA + CRONÔMETRO (AGORA COM BORDA VERDE E TEXTO CENTRALIZADO) -->
                <div id="infoMotorista" class="hidden bg-white border-2 border-green-500 rounded-xl p-5 text-center mb-6 shadow-md">
                    <p class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2">Motorista Parceiro</p>
                    <p id="nomeMot" class="font-black text-gray-900 text-xl mb-1">---</p>
                    <p id="veiculoMot" class="text-sm text-gray-600 font-bold mb-4">🚗 --- (<span id="placaMot">---</span>)</p>
                    
                    <!-- ⏱️ O CRONÔMETRO -->
                    <div id="areaCronometroCancelamento" class="hidden mt-4 pt-4 border-t border-gray-100">
                        <!-- O JavaScript preencherá o reloginho aqui -->
                    </div>
                </div>

                <button id="btnCancelarCorrida" onclick="cancelarCorridaPassageiro()" class="w-full mt-auto bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 font-bold py-4 rounded-xl shadow-sm transition">
                    Cancelar Viagem ❌
                </button>
            </div>

        </div>
    </div>

    <!-- MODAL ESCOLHER PAGAMENTO -->
    <div id="modalPagamento" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-end justify-center">
        <div class="bg-white rounded-t-3xl w-full max-w-sm p-6 shadow-2xl animate-[slideUp_0.3s_ease-out]">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Selecione o Método</h3>
            <div class="space-y-2">
                <button onclick="escolherPagamento('Dinheiro', '💵')" class="w-full flex items-center gap-4 p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition">
                    <span class="text-2xl">💵</span><span class="font-bold text-gray-700">Dinheiro</span>
                </button>
                <button onclick="escolherPagamento('Pix Integrado', '⚡')" class="w-full flex items-center gap-4 p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition">
                    <span class="text-2xl">⚡</span><span class="font-bold text-gray-700">Pix Integrado</span>
                </button>
                <button onclick="escolherPagamento('Cartão de Crédito', '💳')" class="w-full flex items-center gap-4 p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition">
                    <span class="text-2xl">💳</span><span class="font-bold text-gray-700">Cartão de Crédito</span>
                </button>
                <button onclick="escolherPagamento('Cartão de Débito', '💳')" class="w-full flex items-center gap-4 p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition">
                    <span class="text-2xl">💳</span><span class="font-bold text-gray-700">Cartão de Débito</span>
                </button>
            </div>
            <button onclick="document.getElementById('modalPagamento').classList.add('hidden')" class="w-full mt-4 py-3 font-bold text-gray-500 hover:bg-gray-100 rounded-xl transition">Cancelar</button>
        </div>
    </div>

    <script>
        const BASE_URL = "https://transporte-interiorano-backend.onrender.com";
        const token = localStorage.getItem('tokenSessao');
        if (!token) window.location.href = 'login.html';

        let veiculoSelecionado = 'Carro';
        let pagamentoSelecionado = 'Dinheiro';
        let corridaGlobalId = null;
        let loopMonitoramento = null;

        window.onload = async function() {
            fetch(`${BASE_URL}/usuarios/alterar_modalidade`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ modalidade: "Emergencial" })
            }).catch(e => console.error(e));

            try {
                const res = await fetch(`${BASE_URL}/pagamentos/emergente/verificar_debito`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const json = await res.json();
                
                if (json.bloqueado) {
                    mostrarTelaDeBloqueio(json.detalhes);
                    return; 
                }

                recuperarEstado();
            } catch (e) { console.error("Erro na auditoria financeira."); }
        };

        function selecionarVeiculo(tipo) {
            veiculoSelecionado = tipo;
            document.getElementById('textoBtnVeiculo').textContent = tipo;
            const btnCarro = document.getElementById('btnCarro');
            const btnMoto = document.getElementById('btnMoto');
            if (tipo === 'Carro') {
                btnCarro.className = "flex-1 bg-blue-50 border-2 border-azul rounded-xl p-4 flex flex-col items-center justify-center transition";
                btnMoto.className = "flex-1 bg-white border-2 border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center transition";
            } else {
                btnMoto.className = "flex-1 bg-blue-50 border-2 border-azul rounded-xl p-4 flex flex-col items-center justify-center transition";
                btnCarro.className = "flex-1 bg-white border-2 border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center transition";
            }
        }

        function escolherPagamento(nome, icone) {
            pagamentoSelecionado = nome;
            document.getElementById('iconePagamento').textContent = icone;
            document.getElementById('textoPagamento').textContent = nome;
            document.getElementById('modalPagamento').classList.add('hidden');
        }

        async function solicitarCorrida() {
            const origem = document.getElementById('origem').value;
            const destino = document.getElementById('destino').value;

            if(!origem || !destino) return alert("Preencha a origem e o destino.");

            mostrarLoading("Processando sua chamada...");

            const payload = {
                endereco_origem: origem, endereco_destino: destino,
                origem_latitude: 0.0, origem_longitude: 0.0,
                destino_latitude: 0.0, destino_longitude: 0.0,
                veiculo_tipo: veiculoSelecionado,
                forma_pagamento: pagamentoSelecionado 
            };

            try {
                const res = await fetch(`${BASE_URL}/corridas/emergentes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                
                const json = await res.json();
                
                if (!res.ok && !res.status === 201) {
                    removerLoading();
                    return alert("Erro: " + json.erro);
                }

                const ehDinheiro = pagamentoSelecionado === 'Dinheiro';

                if (ehDinheiro) {
                    removerLoading();
                    corridaGlobalId = json.corrida_id;
                    iniciarMonitoramento(); 
                } else {
                    const resPix = await fetch(`${BASE_URL}/pagamentos/emergente/gerar_pix_corrida`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ corrida_id: json.corrida_id })
                    });
                    const jsonPix = await resPix.json();
                    removerLoading();

                    if (resPix.ok) {
                        mostrarModalPix(jsonPix.pix_copia_cola, json.corrida_id, "Pagamento Antecipado", `Confirme o pagamento via ${pagamentoSelecionado}.`, "verificar_pagamento_corrida");
                    } else { alert("Erro ao gerar link de pagamento."); }
                }

            } catch (e) {
                removerLoading();
                alert("Falha de rede.");
            }
        }

        function iniciarMonitoramento() {
            document.getElementById('telaFormulario').classList.add('hidden');
            document.getElementById('telaMonitoramento').classList.remove('hidden');
            
            verificarStatusServidor();
            if(loopMonitoramento) clearInterval(loopMonitoramento);
            loopMonitoramento = setInterval(verificarStatusServidor, 5000);
        }

        async function verificarStatusServidor() {
            if(!corridaGlobalId) return;

            try {
                const res = await fetch(`${BASE_URL}/corridas/emergentes/status/${corridaGlobalId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if(res.status === 404) {
                    resetarTela();
                    alert("Sua viagem expirou no radar.");
                    return;
                }

                const dados = await res.json();
                const statusMotorista = dados.status;
                const icone = document.getElementById('iconeMonitoramento');
                const titulo = document.getElementById('tituloMonitoramento');
                const subtitulo = document.getElementById('subtituloMonitoramento');
                const infoMot = document.getElementById('infoMotorista');
                const areaCronometro = document.getElementById('areaCronometroCancelamento');

                if (statusMotorista === "Procurando") {
                    icone.innerHTML = '<i class="fa-solid fa-radar fa-spin"></i>';
                    titulo.textContent = "Procurando Parceiros...";
                    subtitulo.textContent = "Aguardando um motorista aceitar seu chamado.";
                    infoMot.classList.add('hidden');
                    areaCronometro.classList.add('hidden');
                } 
                else if (statusMotorista === "Aceita") {
                    icone.innerHTML = '<i class="fa-solid fa-car-side text-verde bounce"></i>';
                    titulo.textContent = "Motorista a Caminho!";
                    titulo.className = "text-2xl font-black text-verde mb-2";
                    subtitulo.textContent = "Aguarde no local de partida.";
                    
                    infoMot.classList.remove('hidden');
                    document.getElementById('nomeMot').textContent = dados.motorista_nome || "Parceiro";
                    document.getElementById('veiculoMot').textContent = dados.veiculo || "Veículo";
                    document.getElementById('placaMot').textContent = dados.placa || "ABC-1234";
                    document.getElementById('btnCancelarCorrida').textContent = "Cancelar Viagem ❌";
                    
                    // ⏱️ GATILHO DO CRONÔMETRO
                    let limiteEpoch = localStorage.getItem('limiteCancelamento_' + corridaGlobalId);
                    if (!limiteEpoch) {
                        limiteEpoch = Date.now() + 180000; // 3 minutos
                        localStorage.setItem('limiteCancelamento_' + corridaGlobalId, limiteEpoch);
                    }
                    areaCronometro.classList.remove('hidden');
                } 
                else if (statusMotorista === "Em Viagem") {
                    icone.innerHTML = '<i class="fa-solid fa-route text-blue-600"></i>';
                    titulo.textContent = "Viagem em Andamento";
                    titulo.className = "text-2xl font-black text-blue-600 mb-2";
                    subtitulo.textContent = "Dirigindo até o destino final com segurança.";
                    
                    document.getElementById('btnCancelarCorrida').classList.add('hidden'); 
                    areaCronometro.classList.add('hidden'); 
                } 
                else if (statusMotorista === "Finalizada") {
                    clearInterval(loopMonitoramento);
                    localStorage.removeItem('limiteCancelamento_' + corridaGlobalId);
                    
                    if (dados.pago === false) {
                        alert("🚨 Você foi bloqueado por pendência financeira. O sistema será reiniciado.");
                        window.location.href = 'login.html'; 
                    } else {
                        alert("🏁 Você chegou ao seu destino!\nObrigado por viajar com a Transporte Interiorano!");
                        window.location.reload(); 
                    }
                }
                else if (statusMotorista.includes("Cancelada")) {
                    alert("⚠️ Esta viagem foi cancelada.");
                    resetarTela();
                }

            } catch(e) {}
        }

        // 🟢 LOOP DO CRONÔMETRO VISUAL 
        setInterval(() => {
            const areaCronometro = document.getElementById('areaCronometroCancelamento');
            if(areaCronometro && !areaCronometro.classList.contains('hidden') && corridaGlobalId) {
                const limiteStr = localStorage.getItem('limiteCancelamento_' + corridaGlobalId);
                const limiteMs = parseInt(limiteStr);
                
                if(!isNaN(limiteMs)) {
                    const diff = limiteMs - Date.now();
                    
                    if(diff > 0) {
                        const min = Math.floor(diff / 60000);
                        const sec = Math.floor((diff % 60000) / 1000);
                        const colorClass = diff > 30000 ? "text-gray-800" : "text-red-600";
                        
                        areaCronometro.innerHTML = `
                            <p class="text-[10px] uppercase tracking-wide font-bold text-gray-500 mb-1">Cancelamento Gratuito</p>
                            <p class="text-3xl font-black ${colorClass}"><i class="fa-regular fa-clock"></i> ${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}</p>
                        `;
                    } else {
                        areaCronometro.innerHTML = `
                            <p class="text-[10px] uppercase tracking-wide font-bold text-gray-500 mb-1">Cancelamento Gratuito</p>
                            <p class="text-xs font-bold text-red-600 mt-1">⚠️ Tempo esgotado. Cancelar agora poderá gerar taxas.</p>
                        `;
                    }
                }
            }
        }, 1000);

        async function cancelarCorridaPassageiro() {
            if(!confirm("Deseja realmente cancelar este chamado?")) return;
            try {
                await fetch(`${BASE_URL}/corridas/emergentes/cancelar/${corridaGlobalId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                resetarTela();
            } catch(e) { alert("Falha ao cancelar."); }
        }

        async function recuperarEstado() {
            try {
                const res = await fetch(`${BASE_URL}/corridas/emergentes/recuperar_estado`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const json = await res.json();
                if (json.id && json.is_motorista_desta_corrida === false) {
                    corridaGlobalId = json.id;
                    iniciarMonitoramento();
                }
            } catch(e){}
        }

        function resetarTela() {
            clearInterval(loopMonitoramento);
            if(corridaGlobalId) localStorage.removeItem('limiteCancelamento_' + corridaGlobalId);
            corridaGlobalId = null;
            document.getElementById('telaMonitoramento').classList.add('hidden');
            document.getElementById('telaFormulario').classList.remove('hidden');
            document.getElementById('origem').value = "";
            document.getElementById('destino').value = "";
            document.getElementById('btnCancelarCorrida').classList.remove('hidden');
            document.getElementById('areaCronometroCancelamento').classList.add('hidden');
        }

        // =========================================================================
        // TELAS DE BLOQUEIO E PIX 
        // =========================================================================
        function mostrarTelaDeBloqueio(detalhes) {
            const html = `
                <div class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center">
                    <i class="fa-solid fa-triangle-exclamation text-6xl text-red-600 mb-4"></i>
                    <h2 class="text-2xl font-black text-gray-900 mb-2">Conta Suspensa</h2>
                    <p class="text-gray-600 mb-6 leading-snug">Identificamos que uma corrida anterior (R$ ${detalhes.valor.toFixed(2)}) não foi paga ao motorista.<br><br>Gere o Pix de multa administrativa (R$ 0,01) para desbloquear seu acesso imediatamente.</p>
                    <button onclick="gerarPixMulta(${detalhes.corrida_id})" class="w-full bg-verde hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bolt"></i> Gerar Pix de Desbloqueio (R$ 0,01)
                    </button>
                    <button onclick="window.location.href='login.html'" class="mt-4 text-gray-500 font-bold">Sair / Trocar Conta</button>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        async function gerarPixMulta(idCorrida) {
            mostrarLoading("Gerando código financeiro...");
            try {
                const res = await fetch(`${BASE_URL}/pagamentos/emergente/gerar_pix_debito`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ corrida_id: idCorrida })
                });
                const json = await res.json();
                removerLoading();
                if (res.ok) { mostrarModalPix(json.pix_copia_cola, idCorrida, "Desbloquear Conta", "Multa Administrativa", "verificar_debito"); } 
                else { alert("Erro: " + json.erro); }
            } catch (e) { removerLoading(); alert("Erro de conexão."); }
        }

        function mostrarModalPix(codigoPix, idReferencia, titulo, subtitulo, tipoVerificacao) {
            const html = `
                <div id="modalPixUniversal" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4">
                    <div class="bg-gray-100 rounded-3xl shadow-2xl p-6 w-full max-w-sm text-center relative border border-gray-200">
                        <h3 class="text-xl font-bold text-azul mb-1">${titulo}</h3>
                        <p class="text-sm text-gray-600 mb-4">${subtitulo}</p>
                        <div class="relative text-left mb-6">
                            <span class="absolute -top-2 left-3 bg-gray-100 px-1 text-[10px] text-gray-500 font-bold">Copia e Cola</span>
                            <textarea id="textoPixAreaUniv" readonly class="w-full bg-white border border-gray-300 rounded-xl p-3 text-xs text-gray-700 h-24 resize-none outline-none">${codigoPix}</textarea>
                        </div>
                        <button onclick="copiarPixUniv()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-full mb-3 shadow-md flex justify-center gap-2">Copiar Código 📋</button>
                        <button onclick="verificarPix('${tipoVerificacao}', ${idReferencia})" class="w-full bg-verde hover:bg-green-700 text-white font-bold py-3.5 rounded-full shadow-md flex justify-center gap-2">Já Paguei / Verificar ⚡</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function copiarPixUniv() { const a = document.getElementById('textoPixAreaUniv'); a.select(); document.execCommand('copy'); alert('Copiado!'); }

        async function verificarPix(tipo, id) {
            mostrarLoading("Verificando pagamento...");
            try {
                let url = tipo === "verificar_debito" ? `${BASE_URL}/pagamentos/emergente/verificar_debito` : `${BASE_URL}/pagamentos/emergente/verificar_pagamento_corrida/${id}`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                const json = await res.json();
                removerLoading();
                if (json.pago || json.bloqueado === false) {
                    alert("✅ Pagamento Confirmado!");
                    if(tipo !== "verificar_debito") {
                        corridaGlobalId = id;
                        document.getElementById('modalPixUniversal').remove();
                        iniciarMonitoramento(); 
                    } else { window.location.reload(); }
                } else { alert("⏳ Pagamento não identificado ainda."); }
            } catch (e) { removerLoading(); alert("Erro de rede"); }
        }

        function mostrarLoading(msg) { document.body.insertAdjacentHTML('beforeend', `<div id="globalLoading" class="fixed inset-0 bg-white bg-opacity-90 z-[999] flex flex-col items-center justify-center"><i class="fa-solid fa-spinner fa-spin text-4xl text-azul mb-3"></i><p class="font-bold text-gray-700">${msg}</p></div>`); }
        function removerLoading() { const el = document.getElementById('globalLoading'); if(el) el.remove(); }
    </script>
    <style> 
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } } 
        @keyframes bounce { 0%, 100% { transform: translateY(-5%); } 50% { transform: translateY(0); } } 
        .bounce { animation: bounce 1s infinite; } 
    </style>
</body>
</html>
