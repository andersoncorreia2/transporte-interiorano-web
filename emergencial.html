<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergencial | Transporte Interiorano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { azul: '#0F52BA', verde: '#2ECC71' } } } }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Navbar do Painel -->
    <header class="bg-azul text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-bolt text-yellow-300"></i> Radar Emergencial
        </div>
        <nav class="flex gap-4">
            <a href="painel.html" class="hover:text-gray-300 font-semibold text-sm transition self-center hidden sm:block">Ver Programadas</a>
            <button onclick="fazerLogout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-bold text-sm transition shadow">
                Sair
            </button>
        </nav>
    </header>

    <main class="container mx-auto max-w-2xl px-6 py-10">
        
        <div class="bg-white rounded-2xl p-8 shadow-lg border border-gray-100 relative overflow-hidden">
            <!-- Efeito visual de Radar -->
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-bl-full opacity-50"></div>
            
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Para onde você vai? 📍</h2>
            <p class="text-gray-500 text-sm mb-6">Solicite um motorista parceiro próximo a você.</p>

            <form id="formEmergencial" class="space-y-4">
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Ponto de Partida</label>
                    <div class="flex bg-gray-50 rounded-lg border border-gray-200 overflow-hidden focus-within:ring-2 focus-within:ring-azul focus-within:border-transparent">
                        <span class="pl-4 py-3 text-azul"><i class="fa-solid fa-location-crosshairs"></i></span>
                        <input type="text" id="origem" required placeholder="Ex: Rua da Aurora, Recife" class="w-full px-3 py-3 bg-transparent outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Destino Final</label>
                    <div class="flex bg-gray-50 rounded-lg border border-gray-200 overflow-hidden focus-within:ring-2 focus-within:ring-verde focus-within:border-transparent">
                        <span class="pl-4 py-3 text-verde"><i class="fa-solid fa-flag-checkered"></i></span>
                        <input type="text" id="destino" required placeholder="Ex: Shopping Tacaruna" class="w-full px-3 py-3 bg-transparent outline-none">
                    </div>
                </div>

                <!-- Botões de Escolha do Veículo -->
                <div class="pt-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Tipo de Veículo</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="cursor-pointer">
                            <input type="radio" name="veiculo" value="Carro" class="peer sr-only" checked>
                            <div class="rounded-xl border border-gray-200 p-4 text-center hover:bg-gray-50 peer-checked:border-azul peer-checked:bg-blue-50 peer-checked:ring-1 peer-checked:ring-azul transition">
                                <div class="text-3xl mb-1">🚗</div>
                                <div class="font-bold text-gray-800">Carro</div>
                            </div>
                        </label>
                        
                        <label class="cursor-pointer">
                            <input type="radio" name="veiculo" value="Moto" class="peer sr-only">
                            <div class="rounded-xl border border-gray-200 p-4 text-center hover:bg-gray-50 peer-checked:border-azul peer-checked:bg-blue-50 peer-checked:ring-1 peer-checked:ring-azul transition">
                                <div class="text-3xl mb-1">🏍️</div>
                                <div class="font-bold text-gray-800">Moto</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Botão de Solicitação -->
                <button type="submit" id="btnChamar" class="w-full bg-verde hover:bg-green-600 text-white font-bold py-4 rounded-xl transition shadow-md flex justify-center items-center gap-2 mt-4 text-lg">
                    <i class="fa-solid fa-bolt"></i> Chamar Motorista Agora
                </button>
            </form>

            <!-- Painel de Status (Escondido inicialmente) -->
            <div id="painelStatus" class="hidden mt-6 p-5 bg-blue-50 border border-blue-100 rounded-xl text-center">
                <i class="fa-solid fa-radar fa-spin text-azul text-4xl mb-3"></i>
                <h3 class="text-lg font-bold text-gray-800" id="textoStatus">Procurando motoristas...</h3>
                <p class="text-sm text-gray-600 mt-1">Avisando parceiros próximos a você.</p>
                <button onclick="cancelarBusca()" class="mt-4 text-red-500 font-bold text-sm hover:underline">Cancelar Solicitação</button>
            </div>

        </div>
    </main>

    <!-- 🟢 SCRIPT MÁGICO DO EMERGENCIAL -->
    <script>
        const BASE_URL = "https://transporte-interiorano-backend.onrender.com"; 
        const token = localStorage.getItem('tokenSessao');
        let corridaAtualId = null;

        if (!token) window.location.href = 'login.html';

        function fazerLogout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Função principal do formulário
        document.getElementById('formEmergencial').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const origem = document.getElementById('origem').value;
            const destino = document.getElementById('destino').value;
            const veiculo = document.querySelector('input[name="veiculo"]:checked').value;
            
            const btn = document.getElementById('btnChamar');
            const painelStatus = document.getElementById('painelStatus');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Conectando...';

            try {
                // Dispara o pedido emergencial pro Python! (Usamos coordenadas fake do centro de PE para a web não precisar pedir permissão de GPS agora)
                const resposta = await fetch(`${BASE_URL}/corridas/emergentes`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        origem_latitude: -8.047562, 
                        origem_longitude: -34.877011, 
                        destino_latitude: -8.050000, 
                        destino_longitude: -34.880000, 
                        endereco_origem: origem,
                        endereco_destino: destino,
                        veiculo_tipo: veiculo,
                        forma_pagamento: "Dinheiro" // Padronizado para não travar na web com o Pix
                    })
                });

                const dados = await resposta.json();

                if (resposta.ok || resposta.status === 201) {
                    corridaAtualId = dados.corrida_id;
                    
                    // Esconde o botão e mostra o painel de status
                    btn.classList.add('hidden');
                    painelStatus.classList.remove('hidden');
                    
                    // Fica "escutando" se algum motorista aceitou (a cada 5 segundos)
                    iniciarRadarStatus();
                } else {
                    alert("❌ Erro: " + (dados.erro || "Não foi possível pedir a corrida."));
                    resetarBotao(btn);
                }
            } catch (erro) {
                console.error(erro);
                alert("❌ Erro de comunicação.");
                resetarBotao(btn);
            }
        });

        function resetarBotao(btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Chamar Motorista Agora';
            btn.classList.remove('hidden');
        }

        // Função que fica perguntando pro servidor: "Já achou motorista?"
        let intervaloStatus;
        function iniciarRadarStatus() {
            intervaloStatus = setInterval(async () => {
                try {
                    const resposta = await fetch(`${BASE_URL}/corridas/emergentes/status/${corridaAtualId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const corrida = await resposta.json();

                    if (corrida.status === "Aceita" || corrida.status === "Em Viagem") {
                        document.getElementById('textoStatus').innerHTML = `✅ Motorista ${corrida.motorista_nome} a caminho! <br><span class="text-sm font-normal text-azul">Veículo: ${corrida.veiculo} (${corrida.placa})</span>`;
                    } else if (corrida.status === "Finalizada" || corrida.status === "Expirada") {
                        alert("Corrida encerrada!");
                        clearInterval(intervaloStatus);
                        window.location.reload(); // Recarrega a página para novo chamado
                    }
                } catch (e) { console.error("Erro no radar", e); }
            }, 5000);
        }

        // Função para cancelar se desistir
        async function cancelarBusca() {
            if (!corridaAtualId) return;
            try {
                await fetch(`${BASE_URL}/corridas/emergentes/cancelar/${corridaAtualId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                alert("Busca cancelada.");
                clearInterval(intervaloStatus);
                window.location.reload();
            } catch (e) { alert("Erro ao cancelar."); }
        }
    </script>
</body>
</html>
