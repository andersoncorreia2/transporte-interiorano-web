<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Evento | Transporte Interiorano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { azul: '#0056b3', verde: '#2e7d32', fundo: '#f5f5f5' } } } }
    </script>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <div class="bg-white w-full max-w-sm min-h-[700px] shadow-2xl relative flex flex-col overflow-y-auto">
        
        <!-- Header -->
        <div class="bg-white p-4 flex items-center sticky top-0 z-10 border-b border-gray-100">
            <button onclick="window.location.href='meus_eventos.html'" class="text-azul p-2 hover:bg-gray-100 rounded-full transition mr-3">
                <i class="fa-solid fa-arrow-left text-xl"></i>
            </button>
            <h1 class="text-[20px] font-bold text-azul">Editar Viagem</h1>
        </div>

        <form id="formEditar" class="px-6 py-6 space-y-4 flex-1 flex flex-col hidden">
            <p class="text-gray-500 mb-2">Atualize as informações da viagem:</p>

            <div class="space-y-4">
                <input type="text" id="nomeEvento" required placeholder="Nome do Evento" class="w-full border border-gray-300 rounded-lg p-3 text-gray-900 outline-none focus:border-azul font-bold">
                <input type="text" id="cidadeOrigem" required placeholder="Cidade de Origem" class="w-full border border-gray-300 rounded-lg p-3 text-gray-900 outline-none focus:border-azul font-bold">
                <input type="text" id="enderecoOrigem" required placeholder="Endereço de Origem" class="w-full border border-gray-300 rounded-lg p-3 text-gray-900 outline-none focus:border-azul">
                <input type="text" id="cidadeDestino" required placeholder="Cidade de Destino" class="w-full border border-gray-300 rounded-lg p-3 text-gray-900 outline-none focus:border-azul font-bold">
                <input type="text" id="enderecoDestino" required placeholder="Endereço de Destino" class="w-full border border-gray-300 rounded-lg p-3 text-gray-900 outline-none focus:border-azul">
            </div>

            <div class="flex gap-2">
                <div class="relative flex-[2]">
                    <label class="absolute -top-2 left-2 bg-white px-1 text-[11px] text-gray-500 font-bold">Data e Hora</label>
                    <input type="datetime-local" id="horario" required class="w-full border border-gray-300 rounded-lg p-3 text-gray-900 outline-none focus:border-azul text-sm font-bold">
                </div>
                <div class="relative flex-1">
                    <label class="absolute -top-2 left-2 bg-white px-1 text-[11px] text-gray-500 font-bold">Vagas</label>
                    <input type="number" id="vagas" required class="w-full border border-gray-300 rounded-lg p-3 text-gray-900 outline-none focus:border-azul font-bold">
                </div>
            </div>

            <div class="relative">
                <label class="absolute -top-2 left-2 bg-white px-1 text-[11px] text-gray-500 font-bold">Valor Total (R$)</label>
                <input type="number" step="0.01" id="valorCorrida" required class="w-full border border-gray-300 rounded-lg p-3 text-gray-900 outline-none focus:border-azul font-bold">
            </div>

            <div class="flex-1"></div>

            <button type="submit" id="btnSalvar" class="w-full bg-azul text-white font-bold py-4 rounded-lg shadow-md hover:bg-blue-700 transition mt-6">
                Salvar Alterações
            </button>
        </form>

        <!-- Loading -->
        <div id="loading" class="flex-1 flex flex-col items-center justify-center text-azul">
            <i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i>
            <p class="font-bold">Carregando dados da viagem...</p>
        </div>
    </div>

    <script>
        const BASE_URL = "https://transporte-interiorano-backend.onrender.com";
        const urlParams = new URLSearchParams(window.location.search);
        const eventoId = urlParams.get('id');
        const cpfLogado = localStorage.getItem('cpfLogado');

        if (!cpfLogado) window.location.href = 'login.html';
        if (!eventoId) window.location.href = 'meus_eventos.html';

        window.onload = async function() {
            try {
                const cpfLimpo = cpfLogado.replace(/\D/g, '');
                const resposta = await fetch(`${BASE_URL}/caronas/${cpfLimpo}`);
                const caronas = await resposta.json();
                
                // Encontra a carona específica pelo ID
                const carona = caronas.find(c => c.id == eventoId);

                if (carona) {
                    document.getElementById('nomeEvento').value = carona.evento_nome;
                    document.getElementById('cidadeOrigem').value = carona.cidade_origem;
                    document.getElementById('enderecoOrigem').value = carona.endereco_origem;
                    document.getElementById('cidadeDestino').value = carona.cidade_destino;
                    document.getElementById('enderecoDestino').value = carona.endereco_destino;
                    document.getElementById('vagas').value = carona.vagas;
                    document.getElementById('valorCorrida').value = carona.valor_corrida || '0.00';

                    // Conversão de "DD/MM/YYYY às HH:MM" para "YYYY-MM-DDTHH:MM" pro input HTML
                    try {
                        const partes = carona.horario.split(" às ");
                        const dataPartes = partes[0].split("/");
                        const dataFormatadaHTLM = `${dataPartes[2]}-${dataPartes[1]}-${dataPartes[0]}T${partes[1]}`;
                        document.getElementById('horario').value = dataFormatadaHTLM;
                    } catch(e) { console.error("Formato de hora diferente"); }

                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('formEditar').classList.remove('hidden');
                } else {
                    alert("Evento não encontrado!");
                    window.location.href = 'meus_eventos.html';
                }
            } catch(e) {
                alert("Erro ao buscar dados do evento.");
                window.location.href = 'meus_eventos.html';
            }
        };

        document.getElementById('formEditar').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando...';
            
            // Formatando data de volta para o banco (DD/MM/AAAA às HH:MM)
            const inputData = document.getElementById('horario').value;
            const dataObj = new Date(inputData);
            const dia = String(dataObj.getDate()).padStart(2, '0');
            const mes = String(dataObj.getMonth() + 1).padStart(2, '0');
            const ano = dataObj.getFullYear();
            const horas = String(dataObj.getHours()).padStart(2, '0');
            const mins = String(dataObj.getMinutes()).padStart(2, '0');
            const dataBanco = `${dia}/${mes}/${ano} às ${horas}:${mins}`;

            const payload = {
                evento_nome: document.getElementById('nomeEvento').value,
                cidade_origem: document.getElementById('cidadeOrigem').value,
                endereco_origem: document.getElementById('enderecoOrigem').value,
                cidade_destino: document.getElementById('cidadeDestino').value,
                endereco_destino: document.getElementById('enderecoDestino').value,
                horario: dataBanco,
                vagas: document.getElementById('vagas').value,
                valor_corrida: document.getElementById('valorCorrida').value
            };

            try {
                // Rota PUT que você tem no seu carona_controller.py
                const resposta = await fetch(`${BASE_URL}/caronas/${eventoId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if(resposta.ok || resposta.status === 200) {
                    alert("Viagem atualizada com sucesso!");
                    window.location.href = 'meus_eventos.html';
                } else {
                    alert("Erro ao atualizar viagem.");
                    btn.disabled = false;
                    btn.innerHTML = 'Salvar Alterações';
                }
            } catch(erro) {
                alert("Falha de conexão.");
                btn.disabled = false;
                btn.innerHTML = 'Salvar Alterações';
            }
        });
    </script>
</body>
</html>
