<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Viagens | Transporte Interiorano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { azul: '#0056b3', verde: '#2e7d32', fundo: '#f5f5f5', vermelho: '#d32f2f' } } } }
    </script>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <div class="bg-fundo w-full max-w-sm min-h-[700px] shadow-2xl relative flex flex-col overflow-hidden">

        <!-- Header -->
        <div class="bg-azul text-white p-4 flex items-center shadow-md z-10">
            <button onclick="window.location.href='painel.html'" class="hover:bg-blue-800 p-2 rounded-full transition mr-3">
                <i class="fa-solid fa-arrow-left text-xl"></i>
            </button>
            <h1 class="text-[20px] font-bold tracking-wide">Minhas Viagens</h1>
        </div>

        <!-- Botão Criar Novo -->
        <div class="p-4 bg-white border-b border-gray-200">
            <button onclick="window.location.href='criar_evento.html'" class="w-full bg-verde hover:bg-green-700 text-white font-bold py-3.5 rounded-lg shadow-sm flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-plus text-xl"></i> Nova Viagem Programada
            </button>
        </div>

        <!-- Lista de Eventos do Motorista -->
        <div id="listaMeusEventos" class="flex-1 overflow-y-auto px-4 py-4 space-y-4">
            <div id="loading" class="text-center py-10 text-azul">
                <i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i>
                <p class="font-bold">Buscando seus eventos...</p>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://transporte-interiorano-backend.onrender.com";
        const cpfLogado = localStorage.getItem('cpfLogado');

        if (!cpfLogado) window.location.href = 'login.html';

        window.onload = async function() {
            buscarMeusEventos();
        };

        async function buscarMeusEventos() {
            const lista = document.getElementById('listaMeusEventos');
            const loading = document.getElementById('loading');
            
            const cpfLimpo = cpfLogado.replace(/\D/g, '');

            try {
                // 1. Busca as caronas
                const respostaCaronas = await fetch(`${BASE_URL}/caronas/${cpfLimpo}`, { cache: 'no-store' });
                const todasCaronas = await respostaCaronas.json();

                // 🟢 2. NOVA BUSCA: Puxa as solicitações para fazer a matemática (Igual ao Android)
                const respostaSol = await fetch(`${BASE_URL}/solicitacoes`, { cache: 'no-store' });
                const todasSolicitacoes = await respostaSol.json();

                // Filtra apenas os eventos que este motorista criou
                const meusEventos = todasCaronas.filter(c => {
                    if (!c.motorista_cpf) return false;
                    return c.motorista_cpf.replace(/\D/g, '') === cpfLimpo;
                });

                if (loading) loading.classList.add('hidden');

                if (meusEventos.length === 0) {
                    lista.innerHTML = `
                        <div class="text-center py-12 text-gray-500">
                            <i class="fa-regular fa-calendar-xmark text-5xl mb-4 opacity-50"></i>
                            <p class="font-bold">Você ainda não tem viagens programadas ativas.</p>
                        </div>
                    `;
                    return;
                }

                lista.innerHTML = ''; 

                meusEventos.forEach(carona => {
                    // 🟢 MATEMÁTICA DE VAGAS IDÊNTICA AO KOTLIN
                    const pedidosDestaCarona = todasSolicitacoes.filter(s => s.carona_id === carona.id);
                    
                    const qtdOcupadas = pedidosDestaCarona.filter(s => {
                        const st = (s.status || "").toLowerCase();
                        return st.includes("aceito") || st.includes("pendente") || st.includes("taxa paga") || st.includes("carencia");
                    }).length;

                    const totalVagas = parseInt(carona.vagas) || 4;
                    const vagasRestantes = totalVagas - qtdOcupadas;

                    // Ajusta a cor e o texto se esgotar
                    const corVaga = vagasRestantes > 0 ? "text-verde" : "text-red-600";
                    const textoVaga = vagasRestantes > 0 ? `${vagasRestantes} Vagas Livres` : "Lotação Esgotada";

                    const cardHTML = `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden relative">
                            <div class="p-4 space-y-2">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-azul text-lg leading-tight">${carona.evento_nome}</h3>
                                    <span class="bg-blue-100 text-azul text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">${carona.status}</span>
                                </div>

                                <p class="text-[14px] text-gray-800"><strong>De:</strong> ${carona.cidade_origem}</p>
                                <p class="text-[14px] text-gray-800"><strong>Para:</strong> ${carona.cidade_destino}</p>
                                <p class="text-[14px] text-gray-800 text-red-600 font-bold"><i class="fa-regular fa-clock"></i> Partida: ${carona.horario}</p>
                                
                                <div class="flex justify-between items-center mt-2 pt-2 border-t border-gray-100">
                                    <p class="text-sm font-bold ${corVaga}"><i class="fa-solid fa-user-group"></i> ${textoVaga}</p>
                                    <p class="text-sm font-bold text-gray-800">R$ ${parseFloat(carona.valor_corrida || 0).toFixed(2)}</p>
                                </div>

                                <div class="flex gap-2 mt-4">
                                    <button onclick="alert('Tela de Edição em breve!')" class="flex-1 bg-gray-100 text-gray-700 font-bold py-2.5 rounded-lg text-sm hover:bg-gray-200 transition border border-gray-300">
                                        <i class="fa-solid fa-pen"></i> Editar
                                    </button>
                                    <button onclick="excluirEvento(${carona.id})" class="flex-1 bg-red-50 text-vermelho font-bold py-2.5 rounded-lg text-sm hover:bg-red-100 transition border border-red-200">
                                        <i class="fa-solid fa-trash"></i> Excluir
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    lista.innerHTML += cardHTML;
                });

            } catch (erro) {
                if (loading) loading.innerHTML = `<p class="text-red-500 font-bold">Erro ao carregar seus eventos.</p>`;
            }
        }

        async function excluirEvento(id) {
            if(confirm("Tem certeza que deseja excluir esta viagem? Todas as solicitações vinculadas a ela também serão canceladas.")) {
                try {
                    const res = await fetch(`${BASE_URL}/caronas/${id}`, {
                        method: 'DELETE'
                    });
                    if(res.ok) {
                        alert("Viagem excluída com sucesso!");
                        document.getElementById('listaMeusEventos').innerHTML = `<div id="loading" class="text-center py-10 text-azul"><i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i></div>`;
                        buscarMeusEventos();
                    } else {
                        alert("Erro ao excluir viagem.");
                    }
                } catch(e) {
                    alert("Falha na conexão.");
                }
            }
        }
    </script>
</body>
</html>
